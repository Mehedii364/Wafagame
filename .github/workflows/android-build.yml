name: Android Build & APK Validation

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.build-outputs/**'
      - 'APK_DOWNLOAD/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Validate Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify & Copy APK Outputs
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*debug.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Real APK was not generated by Gradle assembleDebug!"
            exit 1
          fi

          echo "Found generated APK: $APK_PATH"
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

      - name: Validate APK Integrity
        run: |
          echo "=== 1. Listing APK Files ==="
          ls -lh APK_DOWNLOAD/app-debug.apk .build-outputs/app-debug.apk

          echo "=== 2. File Type Verification ==="
          file APK_DOWNLOAD/app-debug.apk

          echo "=== 3. File Size Check (non-zero) ==="
          SIZE=$(stat -c%s APK_DOWNLOAD/app-debug.apk)
          echo "APK Size in bytes: $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK file size too small ($SIZE bytes), aborting!"
            exit 1
          fi

          echo "=== 4. Unzip Testing Zip Structure ==="
          unzip -t APK_DOWNLOAD/app-debug.apk

          echo "=== 5. SHA-256 Hash Matching ==="
          HASH1=$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')
          HASH2=$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')
          echo "Hash 1: $HASH1"
          echo "Hash 2: $HASH2"
          if [ "$HASH1" != "$HASH2" ]; then
            echo "ERROR: SHA256 hashes do not match!"
            exit 1
          fi
          echo "SHA256 verification successful: $HASH1"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          retention-days: 14

      - name: Commit Debug APK to Repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk
          git add -f APK_DOWNLOAD/app-debug.apk
          git diff --cached --quiet || git commit -m "build: update real debug APK artifact [skip ci]"
          git push || echo "Notice: Push skipped or permissions restricted."
